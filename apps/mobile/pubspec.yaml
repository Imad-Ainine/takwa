name: takwa
description: "تطبيق تقوى - تطبيق إسلامي يومي للمحاسبة والمتابعة"
publish_to: "none"
version: 1.6.2+35

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  meta: ^1.15.0

  # ── Shared domain logic & design system (workspace packages) ──
  takwa_core:
    path: ../../packages/takwa_core
  takwa_ui:
    path: ../../packages/takwa_ui

  # ── State Management ──
  flutter_riverpod: ^2.5.1

  # ── Database (Drift/SQLite) ──
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Calendar ──
  hijri: ^3.0.0

  # ── Home Screen Widgets (Android AppWidget / iOS WidgetKit) ──
  home_widget: ^0.10.0

  # ── Push Notifications (new-release broadcast) ──
  # Safe to keep even before a Firebase project is configured —
  # PushNotificationService.initialize() catches the missing-config
  # failure and no-ops. See docs/specs/release-push-notifications.md.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  flutter_localizations:
    sdk: flutter

  # ── Notifications ──
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2

  # ── Prayer Times ──
  adhan: ^2.0.0+1

  # ── Location ──
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0

  # ── Permissions ──
  permission_handler: ^12.0.1

  # ── Utils ──
  collection: ^1.19.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1

  # ── Supabase (Cloud Sync) ──
  supabase_flutter: ^2.11.0
  google_sign_in: ^6.2.1

  # ── Connectivity ──
  connectivity_plus: ^7.1.1 # detect online/offline

  # ── Environment Variables ──
  flutter_dotenv: ^6.0.0
  geocoding: ^5.0.0

  # ── Quran & Audio ──
  quran_library: ^4.0.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18

  # ── PDF and Images ──
  syncfusion_flutter_pdfviewer: ^34.2.6 # upgraded to resolve win32 ^6.x conflict
  cached_network_image: ^3.4.1

  # ── Adhan Background & UI ──
  # Bumped to 11.0.1 for built-in Kotlin (KGP) support — has breaking API changes,
  # see https://pub.dev/packages/flutter_foreground_task/changelog
  flutter_foreground_task: ^11.0.1
  wakelock_plus: ^1.8.0 # 1.8.0 migrated to built-in Kotlin KGP
  flutter_overlay_window: ^0.5.0
  http: ^1.6.0
  speech_to_text: ^7.4.0
  # flutter_tts: KGP migration not yet released. Track https://github.com/dlutton/flutter_tts/issues/476
  # Bumped to 4.2.5 (latest) in the meantime.
  flutter_tts: ^4.2.5

  # Bumped to 13.3.0 for built-in Kotlin support — introduces SharePlus class, see changelog
  share_plus: ^13.3.0
  sound_mode: ^3.0.1
  custom_refresh_indicator: ^4.0.1
  sensors_plus: ^7.1.0 # 7.1.0 added built-in Kotlin support
  flutter_islamic_icons: ^1.0.2
  sentry_flutter: ^9.30.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/sounds/
    - assets/images/
    - assets/tafsir/
    - assets/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    # Used for English UI only — see AppTypographyExtension.fromColors()
    # and AdaptiveStyle.amiri()/.naskh() in packages/takwa_ui, which pick
    # this over Amiri/NotoNaskhArabic based on the active locale. Arabic
    # rendering is untouched.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
