flutter_launcher_icons:
  android: true
  ios: true
  # Takwa launcher: dark-mode background gradient + gold تقوى wordmark
  image_path: "assets/images/launch_icons/takwa_icon_master.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # No adaptive_icon_* keys here on purpose: the art (repo-root vibes.png) is one
  # composed image, so assets/images/launch_icons/_gen_from_vibes.ps1 writes the
  # adaptive layers + mipmap-anydpi-v26/ic_launcher.xml itself. The plugin skips
  # those files entirely while the keys are absent, so they survive a regeneration.
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
