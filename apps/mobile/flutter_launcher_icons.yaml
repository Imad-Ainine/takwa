flutter_launcher_icons:
  android: true
  ios: true
  # Takwa launcher: dark-mode background gradient + gold تقوى wordmark
  image_path: "assets/images/launch_icons/takwa_icon_master.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Modern Android adaptive icon: gradient background layer + safe-zoned foreground
  adaptive_icon_background: "assets/images/launch_icons/takwa_icon_bg.png"
  adaptive_icon_foreground: "assets/images/takwa_transparent_bg.png"

  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
