name: Web Deployment CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Build web application
      run: npm run web:build

    - name: Lint web application
      run: npm run lint --workspace=@takwa/web

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
    
    - name: Install Wrangler (Cloudflare CLI)
      run: npm install -g wrangler
    
    - name: Build Next.js app
      working-directory: .
      run: npm run web:build
    
    - name: Deploy to Cloudflare Pages
      run: |
        # Create or verify project exists
        npx wrangler pages project create takwa \
          --team-id=$CF_TEAM_ID \
          --default-cname=takwa.com \
          --yes || true
        
        # Deploy with explicit project reference
        cd .next
        npx wrangler pages deploy . \
          --project-name=takwa \
          --branch=main \
          --commit-hash=${{ github.sha }} \
          --parent-project-hash=$CF_PROJECT_HASH
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_TEAM_ID: ${{ secrets.CF_TEAM_ID }}
        CF_PROJECT_HASH: ""
