name: Web Deployment CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run web:build

      - name: Lint web application
        run: npm run lint --workspace=@takwa/web

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run web:build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SECRETS_SCAN_OMIT_KEYS: CHARGILY_SECRET_KEY,FREEMIUS_API_TOKEN,FREEMIUS_SECRET_KEY,TAKWA_ADMIN_SECRET,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_URL
        run: |
          npx netlify-cli deploy --build --prod \
            --message "Deploy from GitHub Actions - Commit ${{ github.sha }}"
